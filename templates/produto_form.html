{% extends "base.html" %}

{% block conteudo %}
<main class="wrap painel">
    {% include "_conta_nav.html" %}
    <form class="caixa-form" action="{{ acao }}" method="POST">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <h1>{{ titulo }}</h1>

        {% if erro %}
        <p class="erro">{{ erro }}</p>
        {% endif %}

        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" value="{{ valores.nome }}" required>

        <label for="categoria_id">Categoria</label>
        <select id="categoria_id" name="categoria_id" required>
            <option value="">Escolha…</option>
            {% for c in categorias %}
            <option value="{{ c.id }}" {{ 'selected' if valores.categoria_id|string == c.id|string }}>{{ c.nome }}</option>
            {% endfor %}
        </select>

        <label for="preco">Preço (deixe vazio para mostrar “consulte”)</label>
        <input type="text" id="preco" name="preco" value="{{ valores.preco }}" placeholder="24,90" inputmode="decimal">

        <label for="estoque">Quantidade em estoque</label>
        <input type="number" id="estoque" name="estoque" min="0" value="{{ valores.estoque }}" required>

        <label for="imagem">Foto</label>
        <select id="imagem" name="imagem">
            <option value="">Sem foto (mostra o quadro)</option>
            {% for img in listar_imagens() %}
            <option value="{{ img }}" {{ 'selected' if valores.imagem == img }}>{{ img|replace('produtos/', '') }}</option>
            {% endfor %}
        </select>
        <p class="nota">Para uma foto aparecer aqui, coloque o arquivo na pasta <b>static/img/produtos</b> do projeto.</p>

        <p class="botoes">
            <button class="btn" type="submit">Salvar</button>
            <a class="btn sec-escuro" href="/conta/estoque">Cancelar</a>
        </p>
    </form>
</main>
{% endblock %}
