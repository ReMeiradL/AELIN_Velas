{% extends "base.html" %}

{% block conteudo %}
<main class="wrap painel">
    {% include "_conta_nav.html" %}
    <form class="caixa-form" action="/conta/usuario" method="POST">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <h1>Trocar nome de acesso</h1>

        {% if erro %}
        <p class="erro">{{ erro }}</p>
        {% endif %}

        <p class="rotulo">Nome atual</p>
        <p class="dado">{{ session.usuario }}</p>

        <label for="nome">Novo nome de acesso</label>
        <input type="text" id="nome" name="nome" value="{{ nome }}" autocomplete="username" minlength="3" maxlength="40" required>

        <label for="atual">Sua senha atual</label>
        <input type="password" id="atual" name="atual" autocomplete="current-password" required>

        <p class="botoes">
            <button class="btn" type="submit">Salvar novo nome</button>
            <a class="btn sec-escuro" href="/conta">Cancelar</a>
        </p>
    </form>
</main>
{% endblock %}
