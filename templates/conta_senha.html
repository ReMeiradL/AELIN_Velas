{% extends "base.html" %}

{% block conteudo %}
<main class="wrap painel">
    {% include "_conta_nav.html" %}
    <form class="caixa-form" action="/conta/senha" method="POST">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <h1>Trocar senha</h1>

        {% if erro %}
        <p class="erro">{{ erro }}</p>
        {% endif %}

        <label for="atual">Senha atual</label>
        <input type="password" id="atual" name="atual" autocomplete="current-password" required>

        <label for="nova">Nova senha (mínimo de {{ senha_minima }} caracteres)</label>
        <input type="password" id="nova" name="nova" autocomplete="new-password" minlength="{{ senha_minima }}" required>

        <label for="confirmacao">Repita a nova senha</label>
        <input type="password" id="confirmacao" name="confirmacao" autocomplete="new-password" minlength="{{ senha_minima }}" required>

        <p class="botoes">
            <button class="btn" type="submit">Salvar nova senha</button>
            <a class="btn sec-escuro" href="/conta">Cancelar</a>
        </p>
    </form>
</main>
{% endblock %}
